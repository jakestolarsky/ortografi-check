[package]
name = "ortografi-check"
version = "0.1.0"
description = "Offline Polish proofreader"
edition = "2021"
rust-version = "1.85"

[lib]
name = "ortografi_check_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ortografi-contracts = { path = "../contracts/rust" }
