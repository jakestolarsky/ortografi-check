name: desktop

on:
  push:
    branches: ['desktop/**']
  pull_request:
    paths-ignore:
      - 'engine-java/**'
      - 'benchmarks/**'
      - 'tests/corpus/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: frontend (install, typecheck, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Build static frontend
        run: pnpm build

  tauri-check:
    name: src-tauri (cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps for Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Frontend dist placeholder (tauri::generate_context! needs ../build)
        run: mkdir -p build && echo '<!doctype html>' > build/index.html
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked
