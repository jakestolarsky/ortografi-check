name: desktop

on:
  push:
    branches: ['desktop/**']
  pull_request:
    paths-ignore:
      - 'benchmarks/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: frontend (install, typecheck, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Build static frontend
        run: pnpm build

  tauri-check:
    name: src-tauri (cargo check, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps for Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Frontend dist placeholder (tauri::generate_context! needs ../build)
        run: mkdir -p build && echo '<!doctype html>' > build/index.html
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked
      - name: cargo test (engine supervisor against tests/fixtures/fake_engine.py)
        working-directory: src-tauri
        run: cargo test --locked

  contracts:
    name: contracts (codegen drift, examples)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Pinned so rustfmt output (and therefore the generated file) is stable.
      - uses: dtolnay/rust-toolchain@1.85.1
        with:
          components: rustfmt
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-typify
          key: cargo-typify-0.5.0-${{ runner.os }}-rust-1.85.1
      - name: Install cargo-typify 0.5.0
        run: command -v cargo-typify || cargo install cargo-typify@0.5.0 --locked
      - name: Regenerate and check for drift
        run: |
          contracts/generate.sh
          git diff --exit-code -- contracts/ || { echo "::error::generated contracts are stale; run contracts/generate.sh"; exit 1; }
      - name: Examples validate (ajv) and match corpus
        run: pnpm exec vitest run contracts/
      - name: Rust types deserialize every example
        working-directory: contracts/rust
        run: cargo test --locked

  engine-bundle:
    name: bundled engine (stage + real-engine smoke, ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.12+101.0.LTS' # same pin as engine.yml
          cache: maven
      - name: Linux deps for Tauri 2
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Stage engine (mvn package + jlink) into src-tauri/resources/engine
        run: scripts/prepare-engine.sh
      - name: Size report
        run: |
          {
            echo "### Staged engine (ubuntu x64)"
            echo
            echo '| Part | Installed |'
            echo '|---|---|'
            for p in runtime lib ortografi-engine.jar; do echo "| $p | $(du -sh src-tauri/resources/engine/$p | cut -f1) |"; done
            echo "| total | $(du -sh src-tauri/resources/engine | cut -f1) |"
            echo "| total tar.gz | $(tar czf - -C src-tauri/resources engine | wc -c | awk '{printf "%.1fM", $1/1048576}') |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Frontend dist placeholder (tauri::generate_context! needs ../build)
        run: mkdir -p build && echo '<!doctype html>' > build/index.html
      - name: Supervisor + locate against the real bundled engine (p0-0003 -> 4..4 ",")
        working-directory: src-tauri
        env:
          ORTOGRAFI_TEST_RESOURCE_DIR: ${{ github.workspace }}/src-tauri/resources
        run: cargo test --locked --test real_engine --test locate
